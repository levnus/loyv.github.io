<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Wall</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col items-center p-6">

  <header class="text-center my-6 max-w-xl">
    <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400 mb-2">Echo Wall</h1>
    <p class="text-sm text-slate-400">A shared wall where everyone can publish and see posts.</p>
  </header>

  <section class="w-full max-w-xl bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-6">
    <div id="nameSection">
      <h3 class="text-sm font-semibold text-slate-400 mb-2">Choose Your Username</h3>
      <div class="flex gap-3">
        <input type="text" id="usernameInput"
          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100"
          placeholder="Enter your display name..." maxlength="30">
        <button id="setNameBtn"
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl">
          Set Name
        </button>
      </div>
    </div>
  </section>

  <main class="w-full max-w-xl bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
    <form id="noteForm" class="flex flex-col gap-4">
      <textarea id="noteInput" rows="3" maxlength="250"
        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-100"
        placeholder="Write a message for everyone..." required></textarea>
      <button type="submit" id="submitPostBtn" disabled
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl disabled:opacity-40">
        Choose a username first
      </button>
    </form>
  </main>

  <section class="w-full max-w-xl mt-8">
    <div class="flex justify-between items-center mb-4 px-2">
      <h2 class="text-lg font-semibold text-slate-400">Shared Wall Feed</h2>
      <span id="syncStatus" class="text-xs text-rose-400">Not connected</span>
    </div>
    <div id="boardFeed" class="space-y-4">
      <div id="emptyPrompt" class="text-center py-8 text-slate-500 text-sm">
        No posts yet. Be the first to publish!
      </div>
    </div>
  </section>

<script>
  const SUPABASE_URL = "https://qdncdhvhuhlwrksrxmeq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_BxFce1GWJtPN03dg8pRnLA_EkRk9-Sq";

  const usernameInput = document.getElementById("usernameInput");
  const setNameBtn = document.getElementById("setNameBtn");
  const nameSection = document.getElementById("nameSection");
  const noteForm = document.getElementById("noteForm");
  const noteInput = document.getElementById("noteInput");
  const submitPostBtn = document.getElementById("submitPostBtn");
  const boardFeed = document.getElementById("boardFeed");
  const syncStatus = document.getElementById("syncStatus");

  let myName = "";
  let db = null;
  let channel = null;
  const displayedPosts = new Set();

  function setStatus(message, connected = false) {
    syncStatus.textContent = message;
    syncStatus.className = "text-xs " +
      (connected ? "text-emerald-400" : "text-rose-400");
  }

  function addPost(post) {
    if (!post || displayedPosts.has(post.id)) return;
    displayedPosts.add(post.id);

    const emptyPrompt = document.getElementById("emptyPrompt");
    if (emptyPrompt) emptyPrompt.remove();

    const card = document.createElement("article");
    card.className = "bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-md";

    const header = document.createElement("div");
    header.className = "flex justify-between items-start mb-2";

    const username = document.createElement("strong");
    username.className = "text-indigo-400 text-sm";
    username.textContent = "@" + post.username;

    const timestamp = document.createElement("span");
    timestamp.className = "text-xs text-slate-500";
    const date = new Date(post.created_at);
    timestamp.textContent = Number.isNaN(date.getTime())
      ? ""
      : date.toLocaleString();

    header.append(username, timestamp);

    const message = document.createElement("p");
    message.className = "text-slate-200 text-sm leading-relaxed";
    message.style.whiteSpace = "pre-wrap";
    message.style.overflowWrap = "anywhere";
    message.textContent = post.message;

    card.append(header, message);
    boardFeed.insertBefore(card, boardFeed.firstChild);
  }

  async function loadPosts() {
    const { data, error } = await db
      .from("posts")
      .select("id, username, message, created_at")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {
      console.error("Load posts error:", error);
      setStatus("Could not load posts");
      alert("Could not load posts: " + error.message);
      return;
    }

    data.forEach(addPost);
  }

  async function initSharedBoard() {
    if (db) return;

    if (!window.supabase || !window.supabase.createClient) {
      setStatus("Supabase library failed");
      alert("Supabase library failed to load. Check your internet connection and reload.");
      return;
    }

    try {
      setStatus("Connecting to database...");
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const { error } = await db.from("posts").select("id").limit(1);

      if (error) {
        console.error("Database error:", error);
        setStatus("Database error");
        alert("Database error: " + error.message);
        db = null;
        return;
      }

      await loadPosts();

      channel = db
        .channel("echo-wall-live-feed")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "posts" },
          (payload) => addPost(payload.new)
        )
        .subscribe((status, error) => {
          console.log("Realtime status:", status, error || "");

          if (status === "SUBSCRIBED") {
            setStatus("Live shared feed", true);
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            setStatus("Live connection failed");
            console.error("Realtime error:", error);
            alert("Live updates failed. Check that posts is enabled in Supabase Realtime.");
          } else if (status === "CLOSED") {
            setStatus("Feed disconnected");
          }
        });
    } catch (error) {
      console.error("Connection error:", error);
      setStatus("Connection failed");
      alert("Connection failed: " + (error.message || String(error)));
      db = null;
    }
  }

  setNameBtn.addEventListener("click", async () => {
    const name = usernameInput.value.trim();

    if (!name) {
      alert("Please enter a username first.");
      return;
    }

    if (name.length > 30) {
      alert("Your username must be 30 characters or fewer.");
      return;
    }

    myName = name;

    const label = document.createElement("p");
    label.className = "text-slate-300 font-medium";
    label.textContent = "Posting as: @" + myName;
    nameSection.replaceChildren(label);

    submitPostBtn.disabled = false;
    submitPostBtn.textContent = "Publish to Shared Wall";

    await initSharedBoard();
  });

  noteForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = noteInput.value.trim();

    if (!myName) {
      alert("Please set a username first.");
      return;
    }

    if (!db) {
      alert("The feed is not connected yet. Check the connection status above.");
      return;
    }

    if (!message) return;

    submitPostBtn.disabled = true;
    submitPostBtn.textContent = "Publishing...";

    const { error } = await db.from("posts").insert({
      username: myName,
      message: message
    });

    if (error) {
      console.error("Publish error:", error);
      alert("Could not publish: " + error.message);
      setStatus("Publish failed");
    } else {
      noteInput.value = "";
    }

    submitPostBtn.disabled = false;
    submitPostBtn.textContent = "Publish to Shared Wall";
  });
</script>

</body>
</html>
