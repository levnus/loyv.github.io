<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wall</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: 'Sniglet', system-ui, sans-serif;
    }
    input, textarea { color-scheme: dark; }
    .wall-card {
      background: #111c30;
      border: 1px solid #26334a;
      border-radius: 16px;
      padding: 16px;
    }
    .muted { color: #94a3b8; }
    .action {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .action:hover { background: #334155; }
    .primary {
      background: #4f46e5;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 600;
    }
    .primary:hover { background: #6366f1; }
    .field {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
    }
    .field:focus { border-color: #818cf8; }
    .post-image {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      background: #020617;
      border-radius: 12px;
      margin-top: 12px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hidden { display: none !important; }
    .reply-card {
      margin-left: 8px;
      border-left: 2px solid #334155;
      padding-left: 12px;
    }
  </style>
</head>

<body class="min-h-screen">
<header class="max-w-2xl mx-auto px-4 pt-8 pb-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <h1 class="text-4xl font-black tracking-tight text-indigo-400">Community Wall</h1>
      <p class="muted text-sm mt-1">Your corner of the internet.</p>
    </div>
    <button id="editProfileBtn" class="action hidden">Edit profile</button>
  </div>
  <p id="status" class="text-xs muted mt-3">Connecting...</p>
</header>

<main class="max-w-2xl mx-auto px-4 pb-12 space-y-5">

  <section id="setupPanel" class="wall-card hidden">
    <h2 class="text-xl font-bold mb-1">Welcome to Echo Wall 👋</h2>
    <p class="muted text-sm mb-4">Choose a username. No email needed.</p>
    <form id="setupForm" class="space-y-3">
      <input id="setupUsername" class="field" minlength="2" maxlength="30"
        placeholder="Username (2–30 characters)" required>
      <textarea id="setupBio" class="field" maxlength="250" rows="3"
        placeholder="Short bio (optional)"></textarea>
      <button class="primary w-full" type="submit">Create my profile</button>
    </form>
  </section>

  <section id="myProfile" class="wall-card hidden">
    <div class="flex items-start gap-3">
      <div id="myAvatar" class="w-12 h-12 rounded-full bg-indigo-600 flex items-center justify-center text-xl font-bold">?</div>
      <div class="min-w-0 flex-1">
        <div id="myUsername" class="font-bold text-lg break-words"></div>
        <p id="myBio" class="muted text-sm mt-1 whitespace-pre-wrap break-words"></p>
        <button id="viewMyProfileBtn" class="text-indigo-300 text-sm mt-2">View my profile →</button>
      </div>
    </div>
  </section>

  <section id="composer" class="wall-card hidden">
    <h2 class="font-semibold mb-3">What's on your mind?</h2>
    <form id="postForm" class="space-y-3">
      <div>
  <div class="flex gap-2 mb-2">
    <button type="button" id="boldBtn" class="action" title="Bold text">
      <b>B</b>
    </button>
  </div>

  <textarea id="postMessage" class="field" maxlength="1000" rows="5"
    placeholder="Write something..."></textarea>
</div>
      <div class="flex flex-wrap items-center justify-between gap-3">
        <label class="action cursor-pointer">
          📷 Add image
          <input id="postImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="hidden">
        </label>
        <span id="imageLabel" class="muted text-xs">Images up to 5 MB</span>
      </div>
      <img id="imagePreview" class="hidden max-h-56 rounded-xl object-contain" alt="Image preview">
      <button id="publishBtn" class="primary w-full" type="submit">Publish to Echo Wall</button>
    </form>
  </section>

  <section id="profileView" class="wall-card hidden">
    <div class="flex justify-between items-start gap-3">
      <div class="min-w-0">
        <h2 id="profileViewName" class="text-xl font-bold break-words"></h2>
        <p id="profileViewBio" class="muted text-sm mt-2 whitespace-pre-wrap break-words"></p>
      </div>
      <button id="closeProfileBtn" class="action">Close</button>
    </div>
    <h3 class="font-semibold mt-5 mb-3">Posts</h3>
    <div id="profilePosts" class="space-y-3"></div>
  </section>

  <section>
    <div class="flex justify-between items-center mb-3 px-1">
      <h2 class="text-xl font-bold">The Wall</h2>
      <button id="refreshBtn" class="action">↻ Refresh</button>
    </div>
    <div id="feed" class="space-y-4">
      <div class="wall-card muted text-sm text-center">Loading posts...</div>
    </div>
  </section>

  <section id="editPanel" class="wall-card hidden">
    <h2 class="text-xl font-bold mb-1">Edit your profile</h2>
    <form id="editForm" class="space-y-3 mt-4">
      <label class="block text-sm muted">Username</label>
      <input id="editUsername" class="field" minlength="2" maxlength="30" required>
      <label class="block text-sm muted">Short bio</label>
      <textarea id="editBio" class="field" maxlength="250" rows="3"></textarea>
      <div class="flex gap-2">
        <button type="submit" class="primary flex-1">Save changes</button>
        <button type="button" id="cancelEditBtn" class="action">Cancel</button>
      </div>
    </form>
  </section>

</main>
  
<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://qdncdhvhuhlwrksrxmeq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_BxFce1GWJtPN03dg8pRnLA_EkRk9-Sq";

  const $ = id => document.getElementById(id);

  if (!window.supabase) {
    $("status").textContent = "Supabase failed to load. Check your internet connection.";
    return;
  }

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let myProfile = null;
  let selectedImage = null;
  let allPosts = [];
  let allProfiles = [];
  let allLikes = [];
  let channel = null;
  let loading = false;

  function setStatus(message, good = false) {
    $("status").textContent = message;
    $("status").className = "text-xs mt-3 " + (good ? "text-emerald-400" : "muted");
  }

  function show(id, visible = true) {
    $(id).classList.toggle("hidden", !visible);
  }

  function make(tag, className = "", text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = String(text);
    return el;
  }

  function getProfile(userId) {
    return allProfiles.find(p => p.user_id === userId) || null;
  }

  function dateText(value) {
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? "" : d.toLocaleString();
  }

  function requireUser() {
    if (!currentUser || !currentUser.id) {
      alert("Your session isn't ready. Refresh the page and wait until Echo Wall connects.");
      return false;
    }
    if (!myProfile) {
      alert("Please create your username profile first.");
      return false;
    }
    return true;
  }

  // B button: wrap selected text in bold markers.
  const boldBtn = $("boldBtn");
  if (boldBtn) {
    boldBtn.addEventListener("click", () => {
      const box = $("postMessage");
      const start = box.selectionStart;
      const end = box.selectionEnd;

      if (start === end) {
        alert("Select the text you want to bold first.");
        return;
      }

      const selected = box.value.slice(start, end);
      box.setRangeText(`**${selected}**`, start, end, "select");
      box.focus();
    });
  }

  // Safely render **bold text** without allowing HTML injection.
  function appendFormattedText(element, text) {
    const parts = String(text || "").split(/(\*\*[\s\S]+?\*\*)/g);

    parts.forEach(part => {
      const match = part.match(/^\*\*([\s\S]+)\*\*$/);

      if (match) {
        const bold = document.createElement("strong");
        bold.textContent = match[1];
        element.append(bold);
      } else {
        element.append(document.createTextNode(part));
      }
    });
  }

  function renderMyProfile() {
    if (!myProfile) return;

    $("myUsername").textContent = "@" + myProfile.username;
    $("myBio").textContent = myProfile.bio || "No bio yet.";
    $("myAvatar").textContent = myProfile.username.slice(0, 1).toUpperCase();
    $("editUsername").value = myProfile.username;
    $("editBio").value = myProfile.bio || "";

    show("myProfile");
    show("composer");
    show("editProfileBtn");
    show("setupPanel", false);
  }

  async function ensureSession() {
    const { data: sessionData, error: sessionError } = await db.auth.getSession();
    if (sessionError) throw sessionError;

    if (sessionData.session && sessionData.session.user) {
      currentUser = sessionData.session.user;
    } else {
      const { data, error } = await db.auth.signInAnonymously();

      if (error) {
        throw new Error(
          "Anonymous sign-in failed. In Supabase, enable Authentication → Sign In / Providers → Anonymous Sign-Ins. Details: " +
          error.message
        );
      }

      currentUser = data.user;
    }

    if (!currentUser || !currentUser.id) {
      throw new Error("Supabase did not return a user session. Please refresh.");
    }

    const { data: profile, error } = await db.from("profiles")
      .select("user_id, username, bio, created_at")
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if (error) throw error;

    if (profile) {
      myProfile = profile;
      renderMyProfile();
      setStatus("Connected · public wall", true);
    } else {
      show("setupPanel");
      setStatus("Choose a username to finish setting up.");
    }
  }

  async function refreshData() {
    const [postsRes, profilesRes, likesRes] = await Promise.all([
      db.from("posts")
        .select("id, user_id, username, message, created_at, parent_post_id, image_url")
        .order("created_at", { ascending: false })
        .limit(200),
      db.from("profiles").select("user_id, username, bio, created_at"),
      db.from("likes").select("post_id, user_id")
    ]);

    if (postsRes.error) throw postsRes.error;
    if (profilesRes.error) throw profilesRes.error;
    if (likesRes.error) throw likesRes.error;

    allPosts = postsRes.data || [];
    allProfiles = profilesRes.data || [];
    allLikes = likesRes.data || [];

    renderFeed();

    if (!$("profileView").classList.contains("hidden")) {
      const profileId = $("profileView").dataset.userId;
      if (profileId) renderProfilePosts(profileId);
    }
  }

  function profileButton(userId, fallbackName) {
    const profile = getProfile(userId);
    const button = make(
      "button",
      "text-indigo-300 font-semibold text-sm hover:underline",
      "@" + (profile?.username || fallbackName || "user")
    );

    if (userId) {
      button.addEventListener("click", () => openProfile(userId));
    } else {
      button.disabled = true;
    }

    return button;
  }

  function renderPost(post, isReply = false) {
    const card = make("article", "wall-card");
    if (isReply) card.classList.add("reply-card");

    const top = make("div", "flex justify-between items-start gap-3");
    const author = make("div", "min-w-0");

    author.append(profileButton(post.user_id, post.username));
    author.append(make("p", "muted text-xs mt-1", dateText(post.created_at)));
    top.append(author);

    if (post.user_id && post.user_id === currentUser?.id) {
      top.append(make("span", "text-xs text-emerald-400", "You"));
    }

    card.append(top);

    const messageEl = make("p", "text-sm mt-3 whitespace-pre-wrap break-words");
    appendFormattedText(messageEl, post.message || "");
    card.append(messageEl);

    if (post.image_url) {
      const img = make("img", "post-image");
      img.src = post.image_url;
      img.alt = "Image shared on Echo Wall";
      img.loading = "lazy";
      img.onerror = () => img.remove();
      card.append(img);
    }

    const likeRows = allLikes.filter(l => String(l.post_id) === String(post.id));
    const liked = likeRows.some(l => l.user_id === currentUser?.id);
    const actions = make("div", "flex flex-wrap items-center gap-2 mt-4");

    const likeBtn = make(
      "button",
      "action",
      (liked ? "▲" : "△") + " Like · " + likeRows.length
    );

    likeBtn.addEventListener("click", async () => {
      if (!requireUser()) return;

      likeBtn.disabled = true;

      try {
        if (liked) {
          const { error } = await db.from("likes").delete()
            .eq("post_id", post.id)
            .eq("user_id", currentUser.id);

          if (error) throw error;
        } else {
          const { error } = await db.from("likes").insert({
            post_id: post.id,
            user_id: currentUser.id
          });

          if (error) throw error;
        }

        await refreshData();
      } catch (err) {
        alert("Couldn't update your like: " + err.message);
      } finally {
        likeBtn.disabled = false;
      }
    });

    actions.append(likeBtn);

    // Delete button for your own posts and replies.
    if (post.user_id && post.user_id === currentUser?.id) {
      const deleteBtn = make("button", "action text-rose-400", "🗑 Delete");

      deleteBtn.addEventListener("click", async () => {
        if (!requireUser()) return;
        if (!confirm("Delete this post? Replies may also be deleted.")) return;

        deleteBtn.disabled = true;
        deleteBtn.textContent = "Deleting...";

        try {
          const { error } = await db.from("posts")
            .delete()
            .eq("id", post.id)
            .eq("user_id", currentUser.id);

          if (error) throw error;

          await refreshData();
          setStatus("Post deleted!", true);
        } catch (err) {
          alert("Couldn't delete post: " + err.message);
          deleteBtn.disabled = false;
          deleteBtn.textContent = "🗑 Delete";
        }
      });

      actions.append(deleteBtn);
    }

    let replyBtn = null;
    let replyArea = null;
    let replyInput = null;
    let replySubmit = null;

    if (!isReply) {
      replyBtn = make("button", "action", "↩ Reply");
      actions.append(replyBtn);
    }

    card.append(actions);

    if (!isReply) {
      replyArea = make("div", "hidden mt-3");
      const replyForm = make("form", "space-y-2");

      replyInput = make("textarea", "field");
      replyInput.rows = 4;
      replyInput.maxLength = 1000;
      replyInput.placeholder = "Write a reply...";
      replyInput.required = true;

      replySubmit = make("button", "primary", "Send reply");
      replySubmit.type = "submit";

      replyForm.append(replyInput, replySubmit);

      replyForm.addEventListener("submit", async event => {
        event.preventDefault();

        if (!requireUser()) return;

        const message = replyInput.value.trim();

        if (!message) {
          alert("Please write a reply first.");
          return;
        }

        if (message.length > 1000) {
          alert("Replies can be up to 1,000 characters.");
          return;
        }

        replySubmit.disabled = true;
        replySubmit.textContent = "Sending...";

        try {
          const { error } = await db.from("posts").insert({
            user_id: currentUser.id,
            username: myProfile.username,
            message,
            parent_post_id: post.id,
            image_url: null
          });

          if (error) throw error;

          replyInput.value = "";
          replyArea.classList.add("hidden");
          await refreshData();
          setStatus("Reply posted!", true);
        } catch (err) {
          alert("Couldn't send reply: " + err.message);
        } finally {
          replySubmit.disabled = false;
          replySubmit.textContent = "Send reply";
        }
      });

      replyArea.append(replyForm);
      card.append(replyArea);

      replyBtn.addEventListener("click", () => {
        replyArea.classList.toggle("hidden");
        if (!replyArea.classList.contains("hidden")) replyInput.focus();
      });

      const replies = allPosts
        .filter(p => p.parent_post_id != null &&
          String(p.parent_post_id) === String(post.id))
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      if (replies.length) {
        const repliesBox = make("div", "mt-4 space-y-3");
        replies.forEach(reply => repliesBox.append(renderPost(reply, true)));
        card.append(repliesBox);
      }
    }

    return card;
  }

  function renderFeed() {
    const feed = $("feed");
    feed.replaceChildren();

    const posts = allPosts.filter(p => p.parent_post_id == null);

    if (!posts.length) {
      feed.append(make("div", "wall-card muted text-sm text-center",
        "No posts yet. Be the first to publish!"));
      return;
    }

    posts.forEach(post => feed.append(renderPost(post)));
  }

  function renderProfilePosts(userId) {
    const list = $("profilePosts");
    list.replaceChildren();

    const posts = allPosts.filter(p =>
      p.user_id === userId && p.parent_post_id == null
    );

    if (!posts.length) {
      list.append(make("p", "muted text-sm", "No posts yet."));
      return;
    }

    posts.forEach(post => list.append(renderPost(post)));
  }

  async function openProfile(userId) {
    const profile = getProfile(userId);

    if (!profile) {
      alert("This profile is unavailable. Try refreshing the wall.");
      return;
    }

    $("profileView").dataset.userId = userId;
    $("profileViewName").textContent = "@" + profile.username;
    $("profileViewBio").textContent = profile.bio || "No bio yet.";

    renderProfilePosts(userId);
    show("profileView");
    $("profileView").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("setupForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!currentUser?.id) {
      alert("Your session is not ready. Refresh and try again.");
      return;
    }

    const username = $("setupUsername").value.trim();
    const bio = $("setupBio").value.trim();

    if (username.length < 2 || username.length > 30) {
      alert("Username must be 2–30 characters.");
      return;
    }

    const button = $("setupForm").querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = "Creating profile...";

    try {
      const { data, error } = await db.from("profiles").insert({
        user_id: currentUser.id,
        username,
        bio
      }).select("user_id, username, bio, created_at").single();

      if (error) throw error;

      myProfile = data;
      renderMyProfile();
      await refreshData();
      startRealtime();
      setStatus("Your profile is ready!", true);
    } catch (err) {
      alert(err.code === "23505"
        ? "That username is already taken. Please choose another."
        : "Couldn't create profile: " + err.message);
    } finally {
      button.disabled = false;
      button.textContent = "Create my profile";
    }
  });

  $("postImage").addEventListener("change", () => {
    const file = $("postImage").files[0] || null;

    selectedImage = file;
    $("imagePreview").classList.add("hidden");
    $("imageLabel").textContent = file ? file.name : "Images up to 5 MB";

    if (!file) return;

    const types = ["image/jpeg", "image/png", "image/webp", "image/gif"];

    if (!types.includes(file.type)) {
      alert("Choose a JPG, PNG, WEBP, or GIF image.");
      $("postImage").value = "";
      selectedImage = null;
      $("imageLabel").textContent = "Images up to 5 MB";
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      alert("Images must be 5 MB or smaller.");
      $("postImage").value = "";
      selectedImage = null;
      $("imageLabel").textContent = "Images up to 5 MB";
      return;
    }

    $("imagePreview").src = URL.createObjectURL(file);
    $("imagePreview").classList.remove("hidden");
  });

  $("postForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!requireUser()) return;

    const message = $("postMessage").value.trim();

    if (!message && !selectedImage) {
      alert("Write a message or choose an image.");
      return;
    }

    if (message.length > 1000) {
      alert("Posts can be up to 1,000 characters.");
      return;
    }

    const button = $("publishBtn");
    button.disabled = true;
    button.textContent = "Publishing...";

    try {
      let imageUrl = null;

      if (selectedImage) {
        const ext = selectedImage.name.split(".").pop().toLowerCase();
        const path = currentUser.id + "/" + crypto.randomUUID() + "." + ext;

        const { error: uploadError } = await db.storage.from("echo-images").upload(
          path,
          selectedImage,
          {
            contentType: selectedImage.type,
            cacheControl: "3600",
            upsert: false
          }
        );

        if (uploadError) throw uploadError;

        imageUrl = db.storage.from("echo-images").getPublicUrl(path).data.publicUrl;
      }

      const { error } = await db.from("posts").insert({
        user_id: currentUser.id,
        username: myProfile.username,
        message,
        image_url: imageUrl,
        parent_post_id: null
      });

      if (error) throw error;

      $("postMessage").value = "";
      $("postImage").value = "";
      $("imagePreview").classList.add("hidden");
      $("imageLabel").textContent = "Images up to 5 MB";
      selectedImage = null;

      await refreshData();
      setStatus("Published successfully!", true);
    } catch (err) {
      alert("Couldn't publish your post: " + err.message);
    } finally {
      button.disabled = false;
      button.textContent = "Publish to Echo Wall";
    }
  });

  $("editProfileBtn").addEventListener("click", () => {
    if (!myProfile) return;

    $("editUsername").value = myProfile.username;
    $("editBio").value = myProfile.bio || "";

    show("editPanel");
    $("editPanel").scrollIntoView({ behavior: "smooth", block: "center" });
  });

  $("cancelEditBtn").addEventListener("click", () => show("editPanel", false));

  $("editForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!requireUser()) return;

    const username = $("editUsername").value.trim();
    const bio = $("editBio").value.trim();

    if (username.length < 2 || username.length > 30) {
      alert("Username must be 2–30 characters.");
      return;
    }

    const button = $("editForm").querySelector('button[type="submit"]');
    button.disabled = true;

    try {
      const { data, error } = await db.from("profiles")
        .update({ username, bio })
        .eq("user_id", currentUser.id)
        .select("user_id, username, bio, created_at")
        .single();

      if (error) throw error;

      myProfile = data;
      renderMyProfile();
      show("editPanel", false);
      await refreshData();
      setStatus("Profile updated!", true);
    } catch (err) {
      alert(err.code === "23505"
        ? "That username is already taken."
        : "Couldn't update profile: " + err.message);
    } finally {
      button.disabled = false;
    }
  });

  $("viewMyProfileBtn").addEventListener("click", () => {
    if (currentUser?.id) openProfile(currentUser.id);
  });

  $("closeProfileBtn").addEventListener("click", () => show("profileView", false));

  $("refreshBtn").addEventListener("click", async () => {
    const button = $("refreshBtn");
    button.disabled = true;

    try {
      await refreshData();
      setStatus("Wall refreshed.", true);
    } catch (err) {
      alert("Couldn't refresh the wall: " + err.message);
    } finally {
      button.disabled = false;
    }
  });

  function startRealtime() {
    if (channel) return;

    channel = db.channel("echo-wall-live-feed")
      .on("postgres_changes", {
        event: "*",
        schema: "public",
        table: "posts"
      }, async () => {
        try {
          await refreshData();
        } catch (err) {
          console.error("Post refresh failed:", err);
        }
      })
      .on("postgres_changes", {
        event: "*",
        schema: "public",
        table: "likes"
      }, async () => {
        try {
          await refreshData();
        } catch (err) {
          console.error("Like refresh failed:", err);
        }
      })
      .subscribe();
  }

  async function start() {
    if (loading) return;

    loading = true;
    setStatus("Connecting to Echo Wall...");

    try {
      await ensureSession();

      if (myProfile) {
        await refreshData();
        startRealtime();
        setStatus("Connected · live public wall", true);
      }
    } catch (err) {
      console.error("Echo Wall connection error:", err);
      setStatus("Connection failed · see error below");
      $("feed").replaceChildren(
        make("div", "wall-card text-sm text-rose-300",
          "Couldn't connect: " + (err.message || String(err)))
      );
    } finally {
      loading = false;
    }
  }

  start();
})();
</script>
</body>
</html>
