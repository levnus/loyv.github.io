<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Echo Wall</title>
    <!-- Tailwind CSS for sleek styling -->
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col items-center p-6">

    <!-- Header Section -->
    <header class="text-center my-6 max-w-xl">
        <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400 mb-2">Global Echo Wall</h1>
        <p class="text-sm text-slate-400">Set a name and broadcast messages to everyone in the world instantly.</p>
    </header>

    <!-- Account System Container -->
    <section class="w-full max-w-xl bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-6">
        <!-- Auth Form -->
        <div id="authSection">
            <h3 class="text-md font-semibold text-slate-300 mb-3">Sign Up / Log In</h3>
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="usernameInput" 
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500" 
                    placeholder="Enter your display name...">
                <button 
                    id="loginBtn" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md">
                    Set Name
                </button>
            </div>
        </div>

        <!-- Profile Bar -->
        <div id="profileSection" class="hidden flex justify-between items-center">
            <p class="text-slate-300 font-medium">Logged in as: <span id="currentUserDisplay" class="text-indigo-400 font-bold"></span></p>
            <button 
                id="logoutBtn" 
                class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 py-2 px-4 rounded-lg transition-all">
                Change Name
            </button>
        </div>
    </section>

    <!-- Post Input Form -->
    <main class="w-full max-w-xl bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <form id="noteForm" class="flex flex-col gap-4">
            <textarea 
                id="noteInput" 
                rows="4" 
                maxlength="250"
                class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none transition-colors"
                placeholder="What's on your mind? (250 chars max)..."
                required></textarea>
            
            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-lg disabled:opacity-40 disabled:cursor-not-allowed" 
                id="submitPostBtn" 
                disabled>
                Post (Set name above first)
            </button>
        </form>
    </main>

    <!-- Global Feed Board -->
    <section class="w-full max-w-xl mt-8">
        <div class="flex justify-between items-center mb-4 px-2">
            <h2 class="text-lg font-semibold text-slate-400">Live Global Feed</h2>
            <span id="syncStatus" class="text-xs text-emerald-400 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Connected
            </span>
        </div>
        <div id="boardFeed" class="space-y-4">
            <div class="text-center py-8 text-slate-600 text-sm animate-pulse">Loading posts...</div>
        </div>
    </section>

    <!-- App Logic Script -->
    <script>
        // Public server box reserved entirely for your global app messages
        const DB_URL = 'https://kvend.net';

        const authSection = document.getElementById('authSection');
        const profileSection = document.getElementById('profileSection');
        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const currentUserDisplay = document.getElementById('currentUserDisplay');
        const noteForm = document.getElementById('noteForm');
        const noteInput = document.getElementById('noteInput');
        const submitPostBtn = document.getElementById('submitPostBtn');
        const boardFeed = document.getElementById('boardFeed');
        const syncStatus = document.getElementById('syncStatus');

        let currentUsername = localStorage.getItem('wall_username') || '';

        function initAuth() {
            if (currentUsername) {
                authSection.classList.add('hidden');
                profileSection.classList.remove('hidden');
                currentUserDisplay.textContent = currentUsername;
                submitPostBtn.removeAttribute('disabled');
                submitPostBtn.textContent = "Post to Board";
            } else {
                authSection.classList.remove('hidden');
                profileSection.classList.add('hidden');
                submitPostBtn.setAttribute('disabled', 'true');
                submitPostBtn.textContent = "Post (Set name above first)";
            }
        }

        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (!name) return alert('Please enter a display name!');
            currentUsername = name;
            localStorage.setItem('wall_username', name);
            usernameInput.value = '';
            initAuth();
        });

        logoutBtn.addEventListener('click', () => {
            currentUsername = '';
            localStorage.removeItem('wall_username');
            initAuth();
        });

        // Pull down messages stored globally on the server network
        async function fetchGlobalFeed() {
            try {
                const response = await fetch(DB_URL);
                if (!response.ok) return;
                
                const data = await response.json();
                const posts = Array.isArray(data) ? data : [];
                renderFeed(posts);
                
                syncStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Global Live';
            } catch (error) {
                console.error("Connection lag:", error);
            }
        }

        // Upload your message so other people can see it instantly
        noteForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = noteInput.value.trim();
            if (!text || !currentUsername) return;

            submitPostBtn.setAttribute('disabled', 'true');
            submitPostBtn.textContent = "Sending...";

            const newPost = {
                username: currentUsername,
                message: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            try {
                // Grab what's on the server right now
                const response = await fetch(DB_URL);
                let currentPosts = [];
                if (response.ok) {
                    const data = await response.json();
                    currentPosts = Array.isArray(data) ? data : [];
                }

                // Shove your new message right onto the top of the stack
                currentPosts.unshift(newPost);

                // Keep only the newest 50 posts so the page loads super fast
                if (currentPosts.length > 50) currentPosts = currentPosts.slice(0, 50);

                // Save back up to the server box
                await fetch(DB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentPosts)
                });

                noteInput.value = '';
                await fetchGlobalFeed();
            } catch (err) {
                alert("Failed to send post.");
            } finally {
                submitPostBtn.removeAttribute('disabled');
                submitPostBtn.textContent = "Post to Board";
            }
        });

        function renderFeed(posts) {
            boardFeed.innerHTML = '';

            if (posts.length === 0) {
                boardFeed.innerHTML = `<div class="text-center py-8 text-slate-600 text-sm">No global posts yet. Write something to start the wall!</div>`;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-md";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-indigo-400 font-bold text-sm">@${post.username || 'anonymous'}</span>
                        <span class="text-[10px] text-slate-500">${post.timestamp || 'Just now'}</span>
                    </div>
                    <p class="text-slate-200 text-sm leading-relaxed">${post.message || ''}</p>
                `;
                boardFeed.appendChild(card);
            });
        }

        initAuth();
        fetchGlobalFeed();

        // Check for new posts from other people every 5 seconds automatically
        setInterval(fetchGlobalFeed, 5000);
    </script>
</body>
</html>
